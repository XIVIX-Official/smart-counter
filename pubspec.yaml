name: smart_counter
description: A modern mobile and web application for efficiently managing counter rooms and tracking items using QR codes.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  get: ^4.6.5
  
  # UI Components
  cupertino_icons: ^1.0.5
  material_design_icons_flutter: ^7.0.7296
  flutter_screenutil: ^5.8.4
  cached_network_image: ^3.2.3
  
  # QR Code Operations
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1
  
  # Notifications
  firebase_messaging: ^14.6.5
  flutter_local_notifications: ^15.1.0
  
  # API & Networking
  dio: ^5.3.0
  http: ^1.1.0
  connectivity_plus: ^4.0.1
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  
  # Authentication
  firebase_auth: ^4.7.2
  firebase_core: ^2.15.0
  jwt_decoder: ^2.0.1
  
  # Utils
  intl: ^0.18.1
  logger: ^1.4.0
  flutter_dotenv: ^5.1.0
  device_info_plus: ^9.0.3
  package_info_plus: ^4.1.0
  permission_handler: ^10.4.3
  url_launcher: ^6.1.12
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.2
  build_runner: ^2.4.6
  flutter_lints: ^2.0.2
  hive_generator: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.1
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700